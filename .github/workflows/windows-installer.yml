name: Build Windows Release

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Localay Windows x64
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CONFIGURATION: Release
      RUNTIME: win-x64
      PROJECT: Localay.csproj
      PRODUCT: Localay
      VERSION: 1.0.0

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
          cache: true
          cache-dependency-path: Localay.csproj

      - name: Verify project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet --info
          if (-not (Test-Path -LiteralPath $env:PROJECT -PathType Leaf)) {
            throw "Project file not found: $env:PROJECT"
          }

      - name: Restore dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore $env:PROJECT -r $env:RUNTIME
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }

      - name: Build release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build $env:PROJECT `
            -c $env:CONFIGURATION `
            -r $env:RUNTIME `
            --self-contained true `
            --no-restore `
            -bl:artifacts/build.binlog
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed." }

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"

          dotnet publish $env:PROJECT `
            -c $env:CONFIGURATION `
            -r $env:RUNTIME `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:PublishTrimmed=false `
            -o $publish

          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

          $exe = Join-Path $publish "Localay.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected executable was not produced: $exe"
          }

          $exeInfo = Get-Item -LiteralPath $exe
          if ($exeInfo.Length -le 0) { throw "Localay.exe is empty." }
          Write-Host "Built $($exeInfo.FullName) ($($exeInfo.Length) bytes)"

      - name: Verify portable runtime and dependencies
        shell: pwsh
        run: |
          ./Verify-Publish.ps1 -PublishDirectory (Join-Path $env:GITHUB_WORKSPACE "artifacts\publish")
          dotnet list $env:PROJECT package --include-transitive
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed." }

      - name: Add distribution documents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"

          foreach ($file in @("README.md", "LICENSE.md", "THIRD_PARTY_NOTICES.md")) {
            $source = Join-Path $env:GITHUB_WORKSPACE $file
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required distribution file is missing: $file"
            }
            Copy-Item -LiteralPath $source -Destination $publish -Force
          }

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\package"
          $packageName = "$env:PRODUCT-$env:VERSION-windows-x64"
          $staging = Join-Path $packageDir $packageName
          $zip = Join-Path $packageDir "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $publish "*") -Destination $staging -Recurse -Force

          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path $staging -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Windows package was not created."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content `
            -LiteralPath (Join-Path $packageDir "$packageName.sha256") `
            -Encoding ascii

          Write-Host "Package: $zip"
          Write-Host "SHA-256: $hash"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Localay-1.0.0-windows-x64
          path: |
            artifacts/package/Localay-1.0.0-windows-x64.zip
            artifacts/package/Localay-1.0.0-windows-x64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Localay-build-diagnostics
          path: artifacts/*.binlog
          if-no-files-found: ignore
